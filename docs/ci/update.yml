name: Valuations data refresh
on:
  schedule:
    # Mon–Fri 22:00 UTC = 19:00 America/Buenos_Aires (after US cash close ~21:00 UTC / 18:00 BA in EST)
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Persist credentials so update_all.py can push main + gh-pages with GITHUB_TOKEN
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - name: Refresh, validate and deploy
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Do NOT pass --apply-embi (CRP stays manual)
          python scripts/update_all.py --deploy
